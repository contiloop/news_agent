# Install as /etc/newsyslog.d/news-agent.conf to rotate the LaunchAgent logs
# at 1 MiB. Keep seven gzip-compressed archives and do not signal a daemon:
# all four jobs are short-lived one-shot commands.
/Users/YOUR_USER/Library/Logs/news-agent.run-once.stdout.log YOUR_USER:staff 600 7 1024 * NZC
/Users/YOUR_USER/Library/Logs/news-agent.run-once.stderr.log YOUR_USER:staff 600 7 1024 * NZC
/Users/YOUR_USER/Library/Logs/news-agent.reuters.run-once.stdout.log YOUR_USER:staff 600 7 1024 * NZC
/Users/YOUR_USER/Library/Logs/news-agent.reuters.run-once.stderr.log YOUR_USER:staff 600 7 1024 * NZC
/Users/YOUR_USER/Library/Logs/news-agent.feedback.stdout.log YOUR_USER:staff 600 7 1024 * NZC
/Users/YOUR_USER/Library/Logs/news-agent.feedback.stderr.log YOUR_USER:staff 600 7 1024 * NZC
/Users/YOUR_USER/Library/Logs/news-agent.watchdog.stdout.log YOUR_USER:staff 600 7 1024 * NZC
/Users/YOUR_USER/Library/Logs/news-agent.watchdog.stderr.log YOUR_USER:staff 600 7 1024 * NZC
